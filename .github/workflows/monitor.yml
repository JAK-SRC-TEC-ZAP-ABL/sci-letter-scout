name: SCI Letter Scout
on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sci-letter-scout-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public paper metadata
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python scan.py
      - name: Persist dedup history and public app feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update monitored literature feed [skip ci]"
            git push
          fi
